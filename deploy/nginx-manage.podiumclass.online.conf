# Podium control panel - Nginx vhost for manage.podiumclass.online
# Place at /etc/nginx/sites-available/manage.podiumclass.online and symlink into sites-enabled.

server {
    listen 80;
    server_name manage.podiumclass.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name manage.podiumclass.online;

    ssl_certificate /etc/letsencrypt/live/manage.podiumclass.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.podiumclass.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Static frontend (built by: cd frontend && npm run build)
    root /srv/apps/podium/frontend/dist;
    index index.html;

    # API reverse proxy -> uvicorn on 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback (Vue Router uses HTML5 history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
