id: podium-frontend
name: Podium Frontend
type: nodejs
environment: production
enabled: true
description: Podium control plane web UI (built SPA)
version: "0.1.0"
tags:
  - platform
  - frontend

paths:
  root: /srv/apps/podium/frontend
  logs: []

runtime:
  process_match: "vite.*5173|node.*vite"

nginx:
  server_name: manage.podiumclass.online

git:
  repository: /srv/apps/podium

deployment:
  enabled: false

backup:
  enabled: false

domains:
  enabled: false

email:
  enabled: false
