id: podium-api
name: Podium API
type: fastapi
environment: production
enabled: true
description: Podium control plane backend API
version: "0.1.0"
tags:
  - platform
  - api

paths:
  root: /srv/apps/podium/backend
  logs: []
  env_file: /srv/apps/podium/backend/.env

runtime:
  process_match: "uvicorn.*app.main|uvicorn.*8000"

nginx:
  server_name: manage.podiumclass.online

git:
  repository: /srv/apps/podium

ssl:
  domain: manage.podiumclass.online

deployment:
  enabled: false

backup:
  enabled: false

domains:
  enabled: false

email:
  enabled: false
